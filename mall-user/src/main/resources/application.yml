server:
  port: 9001

spring:
  application:
    name: mall-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

mall:
  jwt:
    secret: ${JWT_SECRET:mall-cloud-demo-secret-key-change-me-0123456789abcdef}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mall: info
